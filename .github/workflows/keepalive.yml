name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 9 * * 1,4"   # segundas e quintas às 09:00 UTC
  workflow_dispatch:         # permite correr manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido à base de dados
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://bzlkexnvuyafacsissev.supabase.co/rest/v1/submissoes?select=id&limit=1" \
            -H "apikey: sb_publishable_U8sAa_RD74cDokN6D9Z9RQ_uFjrCK_P" \
            -H "Authorization: Bearer sb_publishable_U8sAa_RD74cDokN6D9Z9RQ_uFjrCK_P")
          echo "HTTP $code"
          # 200 = ok; 401/403 também contam como atividade (RLS); falha só se não houver resposta
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi
